name: Weekly Patchy upstream sync

on:
  schedule:
    - cron: "30 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-patchy-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/SethRobinson/Patchy.git
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: automation/patchy-sync
  QT_VERSION: 6.8.3
  MAX_COMMITS_PER_RUN: "25"

jobs:
  sync:
    name: Validate and import safe Patchy commits
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out Lienzo main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "Lienzo upstream sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch Patchy as a read-only source
        run: |
          git remote remove patchy-source 2>/dev/null || true
          git remote add patchy-source "$UPSTREAM_URL"
          git fetch --no-tags patchy-source "$UPSTREAM_BRANCH"
          git checkout -B "$SYNC_BRANCH" main

      - name: Discover commits not already present in Lienzo
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          : > /tmp/patchy-accepted.txt
          : > /tmp/patchy-manual.txt
          : > /tmp/patchy-conflicts.txt
          : > /tmp/patchy-candidates.txt

          git cherry main "patchy-source/$UPSTREAM_BRANCH" |
            awk '$1 == "+" { print $2 }' > /tmp/patchy-candidates.txt

          count="$(wc -l < /tmp/patchy-candidates.txt | tr -d " ")"
          echo "count=$count" >> "$GITHUB_OUTPUT"

          {
            echo "## Patchy sync discovery"
            echo
            echo "Unique Patchy commits detected: **$count**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$count" -gt "$MAX_COMMITS_PER_RUN" ]; then
            echo "Too many upstream commits ($count > $MAX_COMMITS_PER_RUN)." >&2
            exit 2
          fi

      - name: Classify and cherry-pick auto-safe commits
        if: steps.discover.outputs.count != '0'
        id: apply
        shell: bash
        run: |
          set -euo pipefail

          protected_re='^(.github/|README\.md$|AGENTS\.md$|LICENSE$|NOTICE-THIRD-PARTY\.md$|latest_version\.json$|packaging/|scripts/release/|scripts/remote/|docs/release-process\.md$)'

          # Path tags are report-only. Apply rules stay as they are while src/ui
          # is still the shipping interface. See docs/gnome-architecture.md.
          classify_commit_paths() {
            local files="$1"
            local engine=0
            local ui=0
            local other=0
            local f
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                src/core/*|src/render/*|src/psd/*|src/formats/*|src/filters/*|src/color/*|src/support/*|tests/core/*)
                  engine=1
                  ;;
                src/ui/*|src/app/*|tests/ui/*|src/ui-gnome/*|cmake/LienzoGnome.cmake|docs/gnome-architecture.md)
                  ui=1
                  ;;
                *)
                  other=1
                  ;;
              esac
            done <<< "$files"

            if [ "$engine" -eq 1 ] && [ "$ui" -eq 0 ] && [ "$other" -eq 0 ]; then
              printf 'engine'
            elif [ "$ui" -eq 1 ] && [ "$engine" -eq 0 ] && [ "$other" -eq 0 ]; then
              printf 'ui'
            elif [ "$engine" -eq 1 ] && [ "$ui" -eq 1 ]; then
              printf 'mixed'
            else
              printf 'review'
            fi
          }

          while read -r sha; do
            [ -n "$sha" ] || continue

            subject="$(git show -s --format=%s "$sha")"
            files="$(git diff-tree --no-commit-id --name-only -r "$sha")"
            path_class="$(classify_commit_paths "$files")"

            if printf '%s\n' "$files" | grep -Eq "$protected_re"; then
              printf '%s [%s] %s\n' "$sha" "$path_class" "$subject" >> /tmp/patchy-manual.txt
              continue
            fi

            before="$(git rev-parse HEAD)"

            if ! git cherry-pick -x "$sha"; then
              git cherry-pick --abort 2>/dev/null || true
              git reset --hard "$before"
              printf '%s [%s] %s\n' "$sha" "$path_class" "$subject" >> /tmp/patchy-conflicts.txt
              continue
            fi

            identity_ok=1
            test -f src/ui/icons/lienzo-app.png || identity_ok=0
            test -f packaging/linux/com.nodalix.lienzo.desktop || identity_ok=0
            grep -q '^Name=Lienzo$' packaging/linux/com.nodalix.lienzo.desktop || identity_ok=0
            grep -q '^Icon=com.nodalix.lienzo$' packaging/linux/com.nodalix.lienzo.desktop || identity_ok=0
            grep -q 'com\.nodalix\.lienzo' CMakeLists.txt || identity_ok=0
            grep -q 'lienzo-app\.png' src/ui/icons.qrc || identity_ok=0
            grep -q 'QStringLiteral("Lienzo")' src/ui/localization.cpp || identity_ok=0

            if grep -Eq 'MACOSX_BUNDLE_GUI_IDENTIFIER "com\.rtsoft\.patchy"' CMakeLists.txt; then
              identity_ok=0
            fi

            if grep -Eq 'SethRobinson/Patchy' src/ui/update_checker.cpp src/ui/main_window_files.cpp 2>/dev/null; then
              identity_ok=0
            fi

            if [ "$identity_ok" -ne 1 ]; then
              git reset --hard "$before"
              printf '%s [%s] %s [Lienzo identity guard]\n' "$sha" "$path_class" "$subject" >> /tmp/patchy-manual.txt
              continue
            fi

            printf '%s [%s] %s\n' "$sha" "$path_class" "$subject" >> /tmp/patchy-accepted.txt
          done < /tmp/patchy-candidates.txt

          accepted="$(wc -l < /tmp/patchy-accepted.txt | tr -d " ")"
          manual="$(wc -l < /tmp/patchy-manual.txt | tr -d " ")"
          conflicts="$(wc -l < /tmp/patchy-conflicts.txt | tr -d " ")"

          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
          echo "manual=$manual" >> "$GITHUB_OUTPUT"
          echo "conflicts=$conflicts" >> "$GITHUB_OUTPUT"

          {
            echo
            echo "### Classification"
            echo
            echo "- Auto-applied: **$accepted**"
            echo "- Manual review: **$manual**"
            echo "- Cherry-pick conflicts: **$conflicts**"
            echo
            echo "Path tags (\`engine\`, \`ui\`, \`mixed\`, \`review\`) describe the commit. They do not change apply rules while \`src/ui\` is still the shipping interface. Policy: \`docs/gnome-architecture.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: steps.apply.outputs.accepted != '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache Qt
        if: steps.apply.outputs.accepted != '0'
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: .deps/Qt/6.8.3/gcc_64
          key: qt-linux-6.8.3-gcc64-v1

      - name: Install Linux build dependencies
        if: steps.apply.outputs.accepted != '0'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            ninja-build cmake libgl-dev libegl-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1 libfreetype6 libdbus-1-3 \
            libxcb1 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcb-glx0 libxcb-util1 \
            libsm6 libice6 libxext6 libxrender1 xvfb fonts-liberation fonts-dejavu-core

      - name: Install Qt 6.8.3
        if: steps.apply.outputs.accepted != '0' && steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 \
            -m qtimageformats qtpdf \
            -O .deps/Qt

      - name: Prepare Lienzo main baseline
        if: steps.apply.outputs.accepted != '0'
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/lienzo-baseline"
          rm -rf "$baseline"
          git worktree add --detach "$baseline" main
          ln -s "$GITHUB_WORKSPACE/.deps" "$baseline/.deps"

      - name: Configure and build Lienzo main baseline
        if: steps.apply.outputs.accepted != '0'
        working-directory: ${{ runner.temp }}/lienzo-baseline
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release -j 2

      - name: Run Lienzo main baseline tests
        if: steps.apply.outputs.accepted != '0'
        id: baseline
        working-directory: ${{ runner.temp }}/lienzo-baseline
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ctest --test-dir build/linux-release --output-on-failure -j 2 2>&1 | tee /tmp/lienzo-baseline-tests.log
          code="${PIPESTATUS[0]}"
          set -e

          printf '%s\n' "$code" > /tmp/lienzo-baseline-exit.txt

          sed -nE 's/^\[FAIL\] ([^:]+):.*/\1/p' /tmp/lienzo-baseline-tests.log |
            sort -u > /tmp/lienzo-baseline-failures.txt

          sed -nE 's/.*Test #[0-9]+: ([^ ]+).*\*\*\*(Failed|Timeout|Exception).*/\1/p'             /tmp/lienzo-baseline-tests.log |
            sort -u > /tmp/lienzo-baseline-ctest-failures.txt

          echo "Baseline ctest exit: $code"
          echo "Baseline assertion failures: $(wc -l < /tmp/lienzo-baseline-failures.txt)"
          exit 0

      - name: Configure and build candidate Lienzo
        if: steps.apply.outputs.accepted != '0'
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release -j 2

      - name: Run candidate tests
        if: steps.apply.outputs.accepted != '0'
        id: candidate
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ctest --test-dir build/linux-release --output-on-failure -j 2 2>&1 | tee /tmp/lienzo-candidate-tests.log
          code="${PIPESTATUS[0]}"
          set -e

          printf '%s\n' "$code" > /tmp/lienzo-candidate-exit.txt

          sed -nE 's/^\[FAIL\] ([^:]+):.*/\1/p' /tmp/lienzo-candidate-tests.log |
            sort -u > /tmp/lienzo-candidate-failures.txt

          sed -nE 's/.*Test #[0-9]+: ([^ ]+).*\*\*\*(Failed|Timeout|Exception).*/\1/p'             /tmp/lienzo-candidate-tests.log |
            sort -u > /tmp/lienzo-candidate-ctest-failures.txt

          echo "Candidate ctest exit: $code"
          echo "Candidate assertion failures: $(wc -l < /tmp/lienzo-candidate-failures.txt)"
          exit 0

      - name: Reject new regressions
        if: steps.apply.outputs.accepted != '0'
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          comm -13             /tmp/lienzo-baseline-failures.txt             /tmp/lienzo-candidate-failures.txt             > /tmp/lienzo-new-failures.txt

          comm -13             /tmp/lienzo-baseline-ctest-failures.txt             /tmp/lienzo-candidate-ctest-failures.txt             > /tmp/lienzo-new-ctest-failures.txt

          : > /tmp/lienzo-critical-errors.txt
          grep -Ei             'Segmentation fault|core dumped|AddressSanitizer|heap-use-after-free|double free|malloc.*corrupt|terminate called'             /tmp/lienzo-candidate-tests.log             > /tmp/lienzo-critical-errors.txt || true

          new_assertions="$(wc -l < /tmp/lienzo-new-failures.txt | tr -d " ")"
          new_ctest="$(wc -l < /tmp/lienzo-new-ctest-failures.txt | tr -d " ")"
          critical="$(wc -l < /tmp/lienzo-critical-errors.txt | tr -d " ")"

          {
            echo
            echo "### Regression comparison"
            echo
            echo "- New assertion failures: **$new_assertions**"
            echo "- New failing CTest targets: **$new_ctest**"
            echo "- Critical crash signatures: **$critical**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$new_assertions" -ne 0 ] || [ "$new_ctest" -ne 0 ] || [ "$critical" -ne 0 ]; then
            echo "Patchy changes introduced regressions not present on Lienzo main." >&2
            echo "safe=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "safe=true" >> "$GITHUB_OUTPUT"
          echo "No new regressions relative to Lienzo main." >> "$GITHUB_STEP_SUMMARY"

      - name: Recheck Lienzo identity before integration
        if: steps.apply.outputs.accepted != '0' && steps.compare.outputs.safe == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f src/ui/icons/lienzo-app.png
          test -f packaging/linux/com.nodalix.lienzo.desktop
          grep -q '^Name=Lienzo$' packaging/linux/com.nodalix.lienzo.desktop
          grep -q '^Icon=com.nodalix.lienzo$' packaging/linux/com.nodalix.lienzo.desktop
          grep -q 'com\.nodalix\.lienzo' CMakeLists.txt
          grep -q 'lienzo-app\.png' src/ui/icons.qrc
          ! grep -Eq 'MACOSX_BUNDLE_GUI_IDENTIFIER "com\.rtsoft\.patchy"' CMakeLists.txt

      - name: Create sync report
        if: always() && steps.discover.outputs.count != '0'
        shell: bash
        run: |
          {
            echo "# Weekly Patchy sync report"
            echo
            echo "Source: SethRobinson/Patchy@$UPSTREAM_BRANCH"
            echo "Target: $GITHUB_REPOSITORY@main"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo

            echo "## Accepted for automated validation"
            if [ -s /tmp/patchy-accepted.txt ]; then cat /tmp/patchy-accepted.txt; else echo "None."; fi
            echo
            echo "## Manual review"
            if [ -s /tmp/patchy-manual.txt ]; then cat /tmp/patchy-manual.txt; else echo "None."; fi
            echo
            echo "## Cherry-pick conflicts"
            if [ -s /tmp/patchy-conflicts.txt ]; then cat /tmp/patchy-conflicts.txt; else echo "None."; fi
            echo

            if [ -f /tmp/lienzo-new-failures.txt ]; then
              echo "## New assertion failures"
              if [ -s /tmp/lienzo-new-failures.txt ]; then cat /tmp/lienzo-new-failures.txt; else echo "None."; fi
              echo
            fi

            if [ -f /tmp/lienzo-new-ctest-failures.txt ]; then
              echo "## New failing CTest targets"
              if [ -s /tmp/lienzo-new-ctest-failures.txt ]; then cat /tmp/lienzo-new-ctest-failures.txt; else echo "None."; fi
              echo
            fi
          } > /tmp/patchy-sync-report.md

          cat /tmp/patchy-sync-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sync report
        if: always() && steps.discover.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: patchy-sync-report
          path: |
            /tmp/patchy-sync-report.md
            /tmp/patchy-candidates.txt
            /tmp/patchy-accepted.txt
            /tmp/patchy-manual.txt
            /tmp/patchy-conflicts.txt
            /tmp/lienzo-baseline-failures.txt
            /tmp/lienzo-candidate-failures.txt
            /tmp/lienzo-new-failures.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Integrate validated Patchy commits into main
        if: steps.apply.outputs.accepted != '0' && steps.compare.outputs.safe == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          current_main="$(git rev-parse origin/main)"
          starting_main="$(git rev-parse main)"

          if [ "$current_main" != "$starting_main" ]; then
            echo "Lienzo main changed while this workflow was validating. Nothing will be pushed." >&2
            exit 1
          fi

          git push origin HEAD:main

          {
            echo
            echo "### Integration"
            echo
            echo "Validated Patchy commits were fast-forwarded into **main**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No auto-safe Patchy commits
        if: steps.discover.outputs.count != '0' && steps.apply.outputs.accepted == '0'
        run: |
          echo "Patchy has new commits, but none qualified for automatic integration." >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing new upstream
        if: steps.discover.outputs.count == '0'
        run: echo "Lienzo already contains every Patchy patch detected by git cherry."
